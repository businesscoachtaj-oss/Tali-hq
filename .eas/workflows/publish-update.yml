# OTA publish to the production channel (JavaScript-only changes).
# Runs when triggered by hand on expo.dev.
# 27 Nov 2026: the ota-publish push now runs .github/workflows/ota.yml on GitHub instead (no Expo
# minutes used). The push trigger came off here so the two never publish the same update twice.
name: Publish OTA update
on:
  workflow_dispatch: {}
jobs:
  update:
    type: update
    # 23 Nov 2026: set these here so a value saved on Expo's side can never replace them again.
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://jbyzblwrywgxilhmfyjt.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_6boNZk1eRN8-7Z4PIbxB3w_n4VDXf51
      EXPO_PUBLIC_INBOUND_DOMAIN: tali.totality360.com.au
    params:
      channel: production
      message: "Tali HQ update"
