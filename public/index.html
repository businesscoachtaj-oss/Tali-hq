<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tali HQ</title>
    <meta name="description" content="Your AI teammate who remembers your business." />
    <!-- Installable app (PWA): manifest, theme colour and iPhone home screen settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0C0A24" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tali HQ" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* the app's night sky colour, so the phone's bars and any gap match the app */
        background-color: #0C0A24;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* Big desktop screens (27 inch monitors, Macs set to "More space"):
         scale the app up so the text and pictures aren't tiny. */
      @media (min-width: 1680px) { html { zoom: 1.125; } }
      @media (min-width: 1920px) { html { zoom: 1.25; } }
      @media (min-width: 2240px) { html { zoom: 1.4; } }
      @media (min-width: 2560px) { html { zoom: 1.6; } }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
